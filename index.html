<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pega Clube</title>
  <meta name="description" content="Escolha o grupo de ofertas que você quer acompanhar.">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#f7fbff,#d9eeff);color:#3d2350;padding:24px}.card{width:min(100%,560px);background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);border-radius:30px;padding:42px 28px;box-shadow:0 24px 70px rgba(90,31,120,.14);text-align:center}h1{margin:0;color:#5a1f78;font-size:clamp(34px,8vw,52px)}p{font-size:17px;line-height:1.5;color:#715a80;margin:14px auto 28px;max-width:430px}.links{display:grid;gap:12px}.links a{display:block;text-decoration:none;padding:17px 20px;border-radius:16px;font-weight:800;font-size:17px;background:#5a1f78;color:#fff}.links a:last-child{background:#ff5c98}.note{font-size:12px;margin:22px 0 0;color:#927f9c}
  </style>
</head>
<body>
  <main class="card">
    <h1>Pega Clube</h1>
    <p>Escolha o grupo de ofertas que você quer acompanhar.</p>
    <div class="links">
      <a href="/essa/">Pega Essa</a>
      <a href="/fraldas/">Pega Fralda</a>
    </div>
    <p class="note">Achados e promoções direto no WhatsApp.</p>
  </main>
</body>
</html>
